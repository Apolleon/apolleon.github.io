<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>С Новым 2026 Годом! 🎄</title>
    <meta
      name="description"
      content="Интерактивная новогодняя открытка с настоящей анимированной елкой на PixiJS! Наведи на золотые шары — они плавно качаются. Снег, салюты и музыка!"
    />
    <meta property="og:title" content="С Новым 2026 Годом! 🎄✨" />
    <meta
      property="og:description"
      content="Красивая интерактивная елка с качающимися игрушками, падающим снегом и праздничной музыкой. Открой и почувствуй волшебство!"
    />
    <meta
      property="og:image"
      content="https://thumbs.dreamstime.com/b/cozy-christmas-living-room-decorated-tree-glowing-garlands-soft-snow-falling-outside-window-cozy-christmas-living-room-395201212.jpg"
    />
    <meta property="og:type" content="website" />
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Arial, sans-serif;
        touch-action: manipulation;
      }
      #canvas-container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      #greeting {
        position: absolute;
        top: 10%;
        font-size: 2.5em;
        font-weight: bold;
        color: gold;
        text-shadow: 0 0 20px #ff0000, 0 0 40px #ff9900;
        animation: glow 3s ease-in-out infinite alternate;
        z-index: 10;
        pointer-events: none;
        text-align: center;
      }
      @keyframes glow {
        from {
          text-shadow: 0 0 15px #ff0000, 0 0 30px #ff9900;
        }
        to {
          text-shadow: 0 0 30px #ff0000, 0 0 60px #ff9900;
        }
      }
      #play-btn {
        position: absolute;
        bottom: 30px;
        padding: 12px 24px;
        font-size: 1.3em;
        background: rgba(255, 215, 0, 0.9);
        border: none;
        border-radius: 50px;
        color: #000;
        cursor: pointer;
        z-index: 20;
        box-shadow: 0 0 20px gold;
      }
      audio {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <h1 id="greeting">С Новым<br />2026 Годом!</h1>
    <button id="play-btn">▶ Запустить магию</button>

    <audio id="music" loop>
      <source
        src="https://www.singing-bell.com/wp-content/uploads/2013/10/We-wish-you-a-Merry-Christmas-Singing-Bell.mp3"
        type="audio/mpeg"
      />
    </audio>

    <script>
      const container = document.getElementById("canvas-container");
      const app = new PIXI.Application({
        width: window.innerWidth,
        height: window.innerHeight,
        backgroundAlpha: 0,
        antialias: true,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true,
      });
      container.appendChild(app.view);

      // Фон: уютная комната с елкой у окна и камином
      const background = PIXI.Sprite.from(
        "https://thumbs.dreamstime.com/b/cozy-christmas-living-room-decorated-tree-glowing-garlands-soft-snow-falling-outside-window-cozy-christmas-living-room-395201212.jpg"
      );
      background.anchor.set(0.5);
      background.x = app.screen.width / 2;
      background.y = app.screen.height / 2;
      background.width = app.screen.width;
      background.height = app.screen.height;
      app.stage.addChild(background);

      // Золотые круглые игрушки
      const ornamentUrls = [
        "https://static.vecteezy.com/system/resources/previews/021/275/086/non_2x/gold-christmas-ball-isolated-on-a-transparent-background-png.png",
        "https://img.freepik.com/premium-psd/golden-christmas-ball-new-year-decoration-isolated-transparent-background_728565-1344.jpg",
        "https://p7.hiclipart.com/preview/292/723/633/christmas-ornament-gold-clip-art-christmas-balls-transparent-png.jpg",
        "https://png.pngtree.com/png-vector/20251219/ourlarge/pngtree-luxury-golden-christmas-ball-ornament-png-image_18283368.webp",
        "https://www.clipartmax.com/png/middle/18-182075_transparent-gold-christmas-balls-decor-png-picture-gold-christmas-balls-png.png",
      ];

      const ornaments = [];
      const positions = [
        { x: 0.35, y: 0.25 },
        { x: 0.65, y: 0.3 },
        { x: 0.2, y: 0.45 },
        { x: 0.5, y: 0.5 },
        { x: 0.8, y: 0.55 },
        { x: 0.4, y: 0.7 },
        { x: 0.6, y: 0.75 },
      ];

      ornamentUrls.forEach((url, i) => {
        const ornament = PIXI.Sprite.from(url);
        ornament.anchor.set(0.5, 0);
        ornament.scale.set(0.15 + Math.random() * 0.1);
        ornament.x = app.screen.width * positions[i % positions.length].x;
        ornament.y = app.screen.height * positions[i % positions.length].y;
        ornament.originalY = ornament.y;
        ornament.swingPhase = Math.random() * Math.PI * 2;
        ornament.interactive = true;
        ornament.buttonMode = true;

        // Плавное качание при наведении/таче
        ornament.on("pointerover", () => {
          ornament.swinging = true;
        });
        ornament.on("pointerout", () => {
          ornament.swinging = false;
        });
        ornament.on("touchstart", () => {
          ornament.swinging = true;
        });
        ornament.on("touchend", () => {
          ornament.swinging = false;
        });
        ornament.on("touchendoutside", () => {
          ornament.swinging = false;
        });

        app.stage.addChild(ornament);
        ornaments.push(ornament);
      });

      // Лёгкое качание всех игрушек даже без наведения
      app.ticker.add(() => {
        ornaments.forEach((orn) => {
          if (orn.swinging) {
            orn.swingPhase += 0.08;
            orn.rotation = Math.sin(orn.swingPhase) * 0.3; // сильное качание
          } else {
            orn.swingPhase += 0.02;
            orn.rotation = Math.sin(orn.swingPhase) * 0.05; // лёгкое
          }
        });
      });

      // Адаптация под размер экрана
      window.addEventListener("resize", () => {
        app.renderer.resize(window.innerWidth, window.innerHeight);
        background.x = app.screen.width / 2;
        background.y = app.screen.height / 2;
        background.width = app.screen.width;
        background.height = app.screen.height;
      });

      // Запуск опыта (музыка + снег)
      const audio = document.getElementById("music");
      const btn = document.getElementById("play-btn");
      let snowStarted = false;

      function startExperience() {
        audio.play().catch(() => {});
        btn.style.display = "none";
        if (!snowStarted) startSnow();
      }

      document.body.addEventListener("touchstart", startExperience, { once: true });
      document.body.addEventListener("click", startExperience, { once: true });
      btn.onclick = startExperience;

      // Падающий снег (на canvas)
      function startSnow() {
        snowStarted = true;
        const snowContainer = new PIXI.Container();
        app.stage.addChild(snowContainer);

        function createSnowflake() {
          const snow = new PIXI.Graphics();
          snow.beginFill(0xffffff, 0.8);
          snow.drawCircle(0, 0, Math.random() * 4 + 2);
          snow.endFill();
          snow.x = Math.random() * app.screen.width;
          snow.y = -10;
          snow.vx = Math.random() * 2 - 1;
          snow.vy = Math.random() * 3 + 2;
          snowContainer.addChild(snow);

          return snow;
        }

        const flakes = [];
        for (let i = 0; i < 80; i++) flakes.push(createSnowflake());

        app.ticker.add(() => {
          flakes.forEach((flake) => {
            flake.x += flake.vx * 0.5;
            flake.y += flake.vy;
            if (flake.y > app.screen.height) {
              flake.x = Math.random() * app.screen.width;
              flake.y = -10;
            }
          });
        });
      }
    </script>
  </body>
</html>
