<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Line Shooter</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        color: #fff;
        font-family: "Courier New", monospace;
        font-size: 14px;
        z-index: 100;
        pointer-events: none;
        gap: 6px;
      }
      #ui span {
        background: rgba(0, 0, 0, 0.6);
        padding: 6px 10px;
        border-radius: 6px;
        font-weight: bold;
        font-size: 13px;
      }
      #controls-hint {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.5);
        font-family: "Courier New", monospace;
        font-size: 14px;
        z-index: 100;
        pointer-events: none;
      }
      @keyframes waveTextAnim {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(0.8);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.2);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(1);
        }
      }

      @keyframes dmgFloat {
        0% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -30px);
        }
      }
