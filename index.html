<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>С Новым 2026 Годом! 🎄</title>
    <meta
      name="description"
      content="Интерактивная новогодняя открытка с настоящей анимированной елкой на PixiJS! Наведи на золотые шары — они плавно качаются. Снег, салюты и музыка!"
    />
    <meta property="og:title" content="С Новым 2026 Годом! 🎄✨" />
    <meta
      property="og:description"
      content="Красивая интерактивная елка с качающимися игрушками, падающим снегом и праздничной музыкой. Открой и почувствуй волшебство!"
    />
    <meta
      property="og:image"
      content="https://thumbs.dreamstime.com/b/cozy-christmas-living-room-decorated-tree-glowing-garlands-soft-snow-falling-outside-window-cozy-christmas-living-room-395201212.jpg"
    />
    <meta property="og:type" content="website" />
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Arial, sans-serif;
        touch-action: manipulation;
      }
      #canvas-container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      #greeting {
        position: absolute;
        top: 20px;
        line-height: 45px;
        font-size: 2.5em;
        font-weight: 500;
        color: rgb(255, 238, 0);
        animation: neonPulse 1.5s ease-in-out infinite alternate;
        z-index: 10;
        pointer-events: none;
        text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #e7f523, 0 0 40px #e7f523, 0 0 50px #e7f523,
          0 0 70px #e7f523, 0 0 90px #e7f523;
        text-align: center;
      }
      @keyframes neonPulse {
        from {
          text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #e7f523, 0 0 40px #e7f523, 0 0 50px #e7f523,
            0 0 60px #e7f523, 0 0 70px #e7f523;
        }
        to {
          text-shadow: 0 0 20px #fff, 0 0 40px #fff, 0 0 60px #e7f523, 0 0 80px #e7f523, 0 0 100px #e7f523,
            0 0 120px #e7f523, 0 0 140px #e7f523;
        }
      }
      #play-btn {
        position: absolute;
        bottom: 30px;
        padding: 12px 24px;
        font-size: 1.3em;
        background: rgba(255, 215, 0, 0.9);
        border: none;
        border-radius: 50px;
        color: #000;
        cursor: pointer;
        z-index: 20;
        box-shadow: 0 0 20px gold;
      }
      audio {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <span id="greeting"> Пусть новый год будет полон чудес! С любовью, семья Семеновых</span>
    <button id="play-btn">▶ Запустить магию</button>

    <audio id="music" loop>
      <source
        src="https://www.singing-bell.com/wp-content/uploads/2013/10/We-wish-you-a-Merry-Christmas-Singing-Bell.mp3"
        type="audio/mpeg"
      />
    </audio>

    <script>
      const container = document.getElementById("canvas-container");

      const app = new PIXI.Application({
        resizeTo: window.document.body,
        backgroundAlpha: 0,
        antialias: true,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true,
      });

      container.appendChild(app.view);

      // Фон: уютная комната с елкой у окна и камином
      const background = PIXI.Sprite.from("bg.jpg");
      background.anchor.set(0.5);
      background.x = app.screen.width / 2;
      background.y = app.screen.height / 2;
      background.width = app.screen.width;
      background.height = app.screen.height;
      app.stage.addChild(background);

      const treeContainer = new PIXI.Container();

      // Загружаем елку
      const tree = PIXI.Sprite.from("./tree.png");

      // Ждём загрузки текстуры, чтобы получить реальные размеры
      tree.texture.baseTexture.on("loaded", () => {
        // Масштабируем елку по высоте экрана (или как нужно)
        tree.height = app.screen.height * 0.8; // 80% высоты экрана
        tree.scale.x = tree.scale.y; // сохраняем пропорции

        // Центрируем елку внутри контейнера
        tree.anchor.set(0.5, 0.5);
        tree.x = tree.width / 2;
        tree.y = tree.height / 2;

        // Устанавливаем размеры контейнера равными размерам елки
        treeContainer.width = tree.width;
        treeContainer.height = tree.height;

        // Центрируем весь контейнер на экране
        treeContainer.x = app.screen.width / 2;
        treeContainer.y = app.screen.height / 2;

        // Устанавливаем pivot в центр (для возможного вращения/масштабирования контейнера)
        treeContainer.pivot.set(tree.width / 2, tree.height / 2);

        // Добавляем елку в контейнер
        treeContainer.addChild(tree);

        // Теперь добавляем игрушки — только после того, как известны размеры!
        addOrnaments();
      });

      treeContainer.addChild(tree); // Добавляем сразу, но позиционирование внутри onload
      app.stage.addChild(treeContainer);

      // Функция добавления золотых игрушек
      function addOrnaments() {
        const ornamentUrl = "./shape.png";

        const positions = [
          { x: 0.37, y: 0.42 },
          { x: 0.7, y: 0.35 },
          { x: 0.5, y: 0.2 },
          { x: 0.68, y: 0.55 },
          { x: 0.26, y: 0.65 },
          { x: 0.8, y: 0.75 },
          { x: 0.5, y: 0.6 },
        ];

        const ornaments = [];

        const ornamentUrls = Array(7).fill(ornamentUrl);

        ornamentUrls.forEach((url, i) => {
          const ornament = PIXI.Sprite.from(url);
          ornament.anchor.set(0.5, 0); // центр шара

          const scale = 0.12 + Math.random() * 0.01;
          ornament.scale.set(scale);

          const pos = positions[i % positions.length];

          // Позиционируем относительно размеров контейнера (которые равны елке)
          ornament.x = treeContainer.width * pos.x;
          ornament.y = treeContainer.height * pos.y;

          ornament.swingPhase = Math.random() * Math.PI * 2;
          ornament.swinging = false;

          ornament.interactive = true;
          ornament.cursor = "pointer";

          // Качание при наведении
          ornament.on("pointerover", () => (ornament.swinging = true));

          ornament.on("tap", () => (ornament.swinging = true));
          ornament.on("touchendoutside", () => (ornament.swinging = false));

          treeContainer.addChild(ornament);
          ornaments.push(ornament);
        });

        // Анимация качания
        app.ticker.add(() => {
          ornaments.forEach((orn) => {
            if (orn.swinging) {
              orn.swingPhase += 0.1;
              orn.rotation = Math.sin(orn.swingPhase) * 0.4;
            } else {
              orn.swingPhase += 0.02;
              orn.rotation = Math.sin(orn.swingPhase) * 0.05;
            }
          });
        });
      }

      // Адаптация под размер экрана
      window.addEventListener("resize", () => {
        app.renderer.resize(window.innerWidth, window.innerHeight);
        background.x = app.screen.width / 2;
        background.y = app.screen.height / 2;
        background.width = app.screen.width;
        background.height = app.screen.height;
      });

      // Запуск опыта (музыка + снег)
      const audio = document.getElementById("music");
      const btn = document.getElementById("play-btn");
      let snowStarted = false;

      function startExperience() {
        audio.play().catch(() => {});
        btn.style.display = "none";
      }
      if (!snowStarted) startSnow();
      document.body.addEventListener("touchstart", startExperience, { once: true });
      document.body.addEventListener("click", startExperience, { once: true });
      btn.onclick = startExperience;

      // Падающий снег (на canvas)
      function startSnow() {
        snowStarted = true;
        const snowContainer = new PIXI.Container();
        app.stage.addChild(snowContainer);

        function createSnowflake() {
          const snow = new PIXI.Graphics();
          snow.beginFill(0xffffff, 0.8);
          snow.drawCircle(0, 0, Math.random() * 4 + 2);
          snow.endFill();
          snow.x = Math.random() * app.screen.width;
          snow.y = -10;
          snow.vx = Math.random() * 2 - 1;
          snow.vy = Math.random() * 3 + 2;
          snowContainer.addChild(snow);

          return snow;
        }

        const flakes = [];
        for (let i = 0; i < 80; i++) flakes.push(createSnowflake());

        app.ticker.add(() => {
          flakes.forEach((flake) => {
            flake.x += flake.vx * 0.5;
            flake.y += flake.vy;
            if (flake.y > app.screen.height) {
              flake.x = Math.random() * app.screen.width;
              flake.y = -10;
            }
          });
        });
      }
    </script>
  </body>
</html>
